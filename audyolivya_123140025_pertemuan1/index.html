<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini POS Kantin Kampus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mini POS Kantin Kampus</h1>
    <p>Catat belanja, hitung diskon, dan kembalian dengan cepat.</p>
  </header>

  <main class="layout">
    <!-- Bagian 1: Form input barang -->
    <section class="panel">
      <h2>Tambah Barang</h2>
      <form id="form-barang" novalidate>
        <div class="field">
          <label for="nama">Nama barang</label>
          <input type="text" id="nama" placeholder="Contoh: Buku Tulis">
          <small class="error" id="error-nama"></small>
        </div>
        <div class="field">
          <label for="harga">Harga satuan (Rp)</label>
          <input type="number" id="harga" placeholder="Contoh: 5000">
          <small class="error" id="error-harga"></small>
        </div>
        <div class="field">
          <label for="qty">Jumlah</label>
          <input type="number" id="qty" placeholder="Contoh: 2">
          <small class="error" id="error-qty"></small>
        </div>
        <button type="submit" class="btn btn-primary">Tambah ke keranjang</button>
      </form>
    </section>

    <!-- Bagian 2: Tabel keranjang -->
    <section class="panel panel-wide">
      <h2>Keranjang Belanja</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th><th>Nama Barang</th><th class="num">Harga Satuan</th>
              <th class="num">Qty</th><th class="num">Subtotal</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="isi-keranjang"></tbody>
        </table>
      </div>
    </section>

    <!-- Bagian 3: Ringkasan & pembayaran -->
    <section class="panel panel-wide">
      <h2>Pembayaran</h2>
      <dl class="ringkasan">
        <div><dt>Total belanja</dt><dd id="total-belanja">Rp 0</dd></div>
        <div><dt>Diskon</dt><dd id="nominal-diskon">Rp 0</dd></div>
        <div class="grand"><dt>Total akhir</dt><dd id="total-akhir">Rp 0</dd></div>
      </dl>
      <p class="info" id="info-diskon">Belanja minimal Rp 50.000 dapat diskon 10%.</p>

      <div class="field">
        <label for="uang-bayar">Uang bayar (Rp)</label>
        <input type="number" id="uang-bayar" placeholder="Masukkan uang diterima">
      </div>
      <p class="kembalian" id="hasil-kembalian"></p>

      <button type="button" id="btn-reset" class="btn btn-secondary">Transaksi baru</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
